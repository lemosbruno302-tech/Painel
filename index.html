<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gestor - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background: #0f172a; color: white; }</style>
</head>
<body class="min-h-screen">
    <nav class="border-b border-slate-800 p-4 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://files.oaiusercontent.com/file-K1Z5YJg9p7zZ0M1R4A2B3C4D" class="w-10 h-10 rounded-lg">
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">Next Gestor</span>
            </div>
            <button onclick="logout()" class="text-red-400 text-sm font-bold">Sair</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
                <p class="text-slate-400 text-sm font-bold">MEUS CRÉDITOS</p>
                <h2 id="saldoCreditos" class="text-4xl font-black text-cyan-400">0</h2>
            </div>
            <div class="bg-indigo-600/10 p-6 rounded-2xl border border-indigo-500/30">
                <p class="text-indigo-400 text-sm font-bold">AÇÕES</p>
                <div class="flex gap-4 mt-2">
                    <button class="bg-indigo-600 px-4 py-2 rounded-lg font-bold">Novo Cliente</button>
                    <button class="bg-slate-700 px-4 py-2 rounded-lg font-bold">Teste Grátis</button>
                </div>
            </div>
        </div>

        <div class="bg-slate-800/50 rounded-2xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-700/50 text-slate-400 text-xs uppercase">
                    <tr>
                        <th class="p-4">Cliente</th>
                        <th class="p-4">Vencimento</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaClientes" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </main>

    <script>
        const SB_URL = "https://aaytoevlrhbifwhfowtk.supabase.co";
        const SB_KEY = "sb_publishable_dT7Hlqy2U_gGYVxNhu00QA_KZD9a";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const revendaId = localStorage.getItem('next_user_id');
        if (!revendaId) window.location.href = 'index.html';

        async function carregarDados() {
            const { data: revenda } = await _supabase.from('revendedores').select('creditos_saldo').eq('id', revendaId).single();
            if (revenda) document.getElementById('saldoCreditos').innerText = revenda.creditos_saldo;

            const { data: clientes } = await _supabase.from('clientes').select('*').eq('revendedor_id', revendaId);
            const tabela = document.getElementById('listaClientes');
            tabela.innerHTML = clientes?.length ? '' : '<tr><td colspan="3" class="p-10 text-center">Nenhum cliente.</td></tr>';
            
            clientes?.forEach(c => {
                tabela.innerHTML += `<tr class="border-b border-slate-800">
                    <td class="p-4"><b>${c.usuario}</b><br><span class="text-xs text-slate-500">${c.observacao_nome_whatsapp || ''}</span></td>
                    <td class="p-4">${new Date(c.data_vencimento).toLocaleDateString()}</td>
                    <td class="p-4 text-center"><button class="text-cyan-400">Renovar</button></td>
                </tr>`;
            });
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        carregarDados();
    </script>
</body>
</html>
