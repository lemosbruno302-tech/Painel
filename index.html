<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gestor - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">

    <div class="w-full max-w-md p-8 glass rounded-2xl shadow-2xl">
        
        <div class="text-center mb-6">
            <div class="relative inline-block">
                <img src="https://files.oaiusercontent.com/file-K1Z5YJg9p7zZ0M1R4A2B3C4D" alt="Next Gestor Logo" class="w-32 h-32 mx-auto rounded-2xl shadow-lg border-2 border-indigo-500/50 object-cover">
            </div>
            <h1 class="text-3xl font-extrabold mt-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">Next Gestor</h1>
            <p class="text-slate-400 text-sm mt-1">Acesse sua conta de revenda</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Usuário</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" required class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition" placeholder="Nome de usuário">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required class="w-full pl-10 pr-12 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition" placeholder="••••••••">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500"><i id="passIcon" class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>

            <div id="errorMessage" class="hidden p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-xs rounded-lg text-center">
                Usuário ou senha incorretos. Verifique e tente novamente.
            </div>
        </form>

        <p class="mt-8 text-center text-[10px] text-slate-500 uppercase tracking-widest font-bold">
            Powered by Next Gestor &copy; 2026
        </p>
    </div>

    <script>
        // SUAS CHAVES REAIS DO SUPABASE
        const SB_URL = "https://aaytoevlrhbifwhfowtk.supabase.co";
        const SB_KEY = "sb_publishable_dT7Hlqy2U_gGYVxNhu00QA_KZD9a"; // Certifique-se de copiar a chave completa da sua tela
        
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        function togglePassword() {
            const p = document.getElementById('password');
            const i = document.getElementById('passIcon');
            p.type = p.type === 'password' ? 'text' : 'password';
            i.classList.toggle('fa-eye');
            i.classList.toggle('fa-eye-slash');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('errorMessage');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Autenticando...';
            err.classList.add('hidden');

            try {
                const { data, error } = await _supabase
                    .from('revendedores')
                    .select('*')
                    .eq('nome_usuario', user)
                    .eq('senha_texto', pass)
                    .single();

                if (error || !data) {
                    throw new Error("Não encontrado");
                }

                // Salva os dados e redireciona
                localStorage.setItem('next_user_id', data.id);
                localStorage.setItem('next_user_nome', data.nome_usuario);
                
                alert("Sucesso! Bem-vindo ao Next Gestor.");
                // window.location.href = 'painel.html';

            } catch (err_msg) {
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar no Sistema</span> <i class="fa-solid fa-right-to-bracket"></i>';
            }
        });
    </script>
</body>
</html>
