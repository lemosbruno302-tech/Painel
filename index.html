<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gestor - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">
    <div class="w-full max-w-md p-8 glass rounded-2xl shadow-2xl border border-slate-800">
        <div class="text-center mb-6">
            <img src="https://files.oaiusercontent.com/file-K1Z5YJg9p7zZ0M1R4A2B3C4D" alt="Next Gestor Logo" class="w-28 h-28 mx-auto rounded-2xl shadow-lg border-2 border-indigo-500/50 object-cover">
            <h1 class="text-3xl font-extrabold mt-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">Next Gestor</h1>
            <p class="text-slate-400 text-sm mt-1">Painel de Revenda</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 text-left">Usuário</label>
                <input type="text" id="username" required class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:border-indigo-500 text-white outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 text-left">Senha</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:border-indigo-500 text-white outline-none transition">
            </div>
            <button type="submit" id="btnLogin" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition transform active:scale-95">Entrar no Sistema</button>
            <div id="errorMessage" class="hidden p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-xs rounded-lg text-center">Usuário ou senha incorretos.</div>
        </form>
    </div>

    <script>
        const SB_URL = "https://aaytoevlrhbifwhfowtk.supabase.co";
        const SB_KEY = "sb_publishable_dT7Hlqy2U_gGYVxNhu00QA_KZD9a"; // Chave da sua foto
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = "Carregando...";

            try {
                // Tabela ajustada para o nome da sua foto: revedendadores
                const { data, error } = await _supabase.from('revedendadores').select('*').eq('nome_usuario', user).eq('senha_texto', pass).single();
                
                if (error || !data) throw new Error();

                localStorage.setItem('next_user_id', data.id);
                localStorage.setItem('next_user_nome', data.nome_usuario);
                window.location.href = 'painel.html';

            } catch (err) {
                document.getElementById('errorMessage').classList.remove('hidden');
                btn.innerText = "Entrar no Sistema";
            } finally { btn.disabled = false; }
        });
    </script>
</body>
</html>
