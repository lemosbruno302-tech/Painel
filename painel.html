<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gestor - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background: #0f172a; color: white; }</style>
</head>
<body class="min-h-screen">
    <nav class="border-b border-slate-800 p-4 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://files.oaiusercontent.com/file-K1Z5YJg9p7zZ0M1R4A2B3C4D" class="w-10 h-10 rounded-lg">
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">Next Gestor</span>
            </div>
            <button onclick="logout()" class="text-red-400 text-sm font-bold border border-red-500/20 px-3 py-1 rounded-lg">Sair</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Saldo Atual</p>
                <h2 id="saldoCreditos" class="text-5xl font-black text-cyan-400 mt-1">0</h2>
            </div>
            <div class="bg-indigo-600/10 p-6 rounded-2xl border border-indigo-500/30 flex flex-col justify-center">
                <button onclick="criarCliente()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-user-plus"></i> Novo Cliente (+30 dias)
                </button>
            </div>
        </div>

        <div class="bg-slate-800/50 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-700 bg-slate-800/30 font-bold text-slate-300 text-sm">Clientes Ativos</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-900/50 text-slate-500 text-[10px] uppercase">
                        <tr>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Vencimento</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaClientes" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = "https://aaytoevlrhbifwhfowtk.supabase.co";
        const SB_KEY = "sb_publishable_dT7Hlqy2U_gGYVxNhu00QA_KZD9a";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const revendaId = localStorage.getItem('next_user_id');
        if (!revendaId) window.location.href = 'index.html';

        async function carregarDados() {
            // Tabela ajustada para revedendadores
            const { data: revenda } = await _supabase.from('revedendadores').select('creditos_saldo').eq('id', revendaId).single();
            if (revenda) document.getElementById('saldoCreditos').innerText = revenda.creditos_saldo;

            const { data: clientes } = await _supabase.from('clientes').select('*').eq('revendedor_id', revendaId);
            const tabela = document.getElementById('listaClientes');
            tabela.innerHTML = clientes?.length ? '' : '<tr><td colspan="3" class="p-10 text-center text-slate-500">Nenhum cliente.</td></tr>';
            
            clientes?.forEach(c => {
                tabela.innerHTML += `<tr class="hover:bg-white/5">
                    <td class="p-4 font-medium text-white text-sm">${c.usuario}<br><span class="text-[10px] text-slate-500 uppercase">Senha: ${c.senha}</span></td>
                    <td class="p-4 text-xs text-slate-300">${new Date(c.data_vencimento).toLocaleDateString('pt-BR')}</td>
                    <td class="p-4 text-center"><button class="text-cyan-400 text-xs font-bold">Renovar</button></td>
                </tr>`;
            });
        }

        async function criarCliente() {
            const user = prompt("Nome de usuário:");
            const pass = prompt("Senha:");
            if (!user || !pass) return;

            let vcto = new Date();
            vcto.setDate(vcto.getDate() + 30);

            const { error } = await _supabase.from('clientes').insert([{ usuario: user, senha: pass, revendedor_id: revendaId, data_vencimento: vcto }]);
            
            if (error) {
                alert("Erro ao criar (usuário já existe?)");
            } else {
                const saldoAtual = parseInt(document.getElementById('saldoCreditos').innerText);
                await _supabase.from('revedendadores').update({ creditos_saldo: saldoAtual - 1 }).eq('id', revendaId);
                alert("Sucesso! -1 Crédito.");
                carregarDados();
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        carregarDados();
    </script>
</body>
</html>
